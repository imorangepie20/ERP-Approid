# The only origins are the private tunnel network and the loopback diagnostic port.
# Never publish this origin on a LAN/all-interface port: forwarded HTTPS is fixed here.
limit_req_zone $binary_remote_addr zone=erp_login:1m rate=5r/m;

server {
    listen 80;
    server_name erp.approid.team;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    proxy_set_header Host erp.approid.team;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host erp.approid.team;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_read_timeout 60s;

    location = /api/core/auth/login {
        # Aggregate origin limit also prevents spoofing a Cloudflare client-IP header.
        limit_req zone=erp_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-spring:38080;
    }
    location ^~ /api/core/internal/ { return 404; }
    location ^~ /api/core/ { proxy_pass http://backend-spring:38080; }
    location ^~ /api/ { return 404; }
    location ^~ /actuator { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
