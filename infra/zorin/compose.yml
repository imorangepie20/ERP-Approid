name: erp-approid-demo

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set immutable POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_demo
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set generated DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U erp -d erp_demo']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1
    networks: [data]
    logging: *logging

  backend-spring:
    image: ${BACKEND_IMAGE:?Set immutable release tag}
    restart: unless-stopped
    env_file: ../secrets/production.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_demo
      DB_USERNAME: erp
      CORS_ALLOWED_ORIGINS: https://erp.approid.team
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:38080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 900m
    cpus: 1.5
    networks: [app, data]
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set immutable release tag}
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:9082:80"]
    depends_on:
      backend-spring:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.5
    networks: [app]
    logging: *logging

  tunnel:
    image: ${TUNNEL_IMAGE:?Set immutable TUNNEL_IMAGE}
    profiles: [tunnel]
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./tunnel.yml:/etc/cloudflared/config.yml:ro
      - ../secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      frontend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks: [app]
    logging: *logging

volumes:
  postgres-data:
    name: erp-approid-demo-postgres-data

networks:
  app:
  data:
    internal: true
