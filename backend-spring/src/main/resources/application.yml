server:
  port: 38080
  shutdown: graceful

spring:
  application:
    name: backend-spring
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:erp_approid}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp_dev_pw}
    hikari:
      pool-name: core-hikari
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  security:
    jwt:
      secret: ${JWT_SECRET:erp-approid-dev-secret-key-change-in-production-32bytes}
      expiration-minutes: 60
    internal-key: ${INTERNAL_KEY:erp-internal-dev-key}
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
  level:
    com.erpapproid.core: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
