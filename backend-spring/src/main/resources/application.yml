server:
  port: 38080
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB

spring:
  application:
    name: backend-spring
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  web:
    max-request-body-size-bytes: 1048576
  security:
    jwt:
      expiration-minutes: 60
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
  level:
    com.erpapproid.core: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
