spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:erp_approid}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp_dev_pw}

app:
  security:
    jwt:
      secret: erp-approid-test-secret-key-for-automated-tests-32bytes
    internal-key: erp-approid-test-internal-key-for-automated-tests
    cors:
      allowed-origins:
        - http://127.0.0.1:3000
        - http://localhost:3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
