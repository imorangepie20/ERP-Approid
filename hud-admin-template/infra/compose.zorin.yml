x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend
    logging: *default-logging

  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles:
      - tunnel
    restart: unless-stopped
    env_file:
      - ./secrets/tunnel.env
    command: tunnel --no-autoupdate run
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    logging: *default-logging

networks:
  frontend:
    name: hud-admin-frontend
