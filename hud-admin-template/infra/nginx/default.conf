server {
    listen 80;
    server_name _;

    # API는 작은 JSON 문서만 받는다. 프런트 프록시를 추가하더라도 동일한 상한을 유지한다.
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # SPA 라우팅 지원 (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 해시 정적 자산 장기 캐싱
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 보안 헤더
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* https://approid.team https://*.approid.team; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # 에러 페이지 → SPA 라우터로 위임
    error_page 404 /index.html;
}
